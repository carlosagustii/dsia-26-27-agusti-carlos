name: ci                         # nombre que verás en GitHub

on:                              # CUÁNDO se ejecuta:
  push:
    branches: [main]             #   cuando subes algo a main
  pull_request:                  #   cuando abres o actualizas un pull request

jobs:
  test:
    runs-on: ubuntu-latest       # el robot usa un ordenador Linux limpio
    steps:                       # QUÉ hace, en orden:
      - name: Checkout
        uses: actions/checkout@v4          # 1. descarga tu repo

      - name: Set up Python
        uses: actions/setup-python@v5      # 2. instala Python 3.12
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |                             # 3. instala tus dependencias
          python -m pip install --upgrade pip
          pip install -r requirements.txt  #    (incluye -e . : instala el paquete)

      - name: Tests + coverage gate (>= 60%)
        env:
          GENAI_PROVIDER: mock             # IA en modo mock: sin red ni secretos
        run: pytest -q --cov=football_shots --cov-report=term-missing --cov-fail-under=60
                                           # 4. ejecuta tus tests; si fallan o la
                                           #    cobertura baja del 60 %, sale ❌
  docker:
    needs: test                    # solo si los tests pasan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build de la imagen
        run: docker build -t xg-app .

      - name: Arranque de la API (IA en modo mock, sin secretos)
        run: docker run -d -p 8000:8000 -e GENAI_PROVIDER=mock --name xg xg-app

      - name: Esperar a /health (máx. ~60 s)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API lista tras ${i} intentos"; exit 0
            fi
            sleep 2
          done
          echo "La API no respondió a tiempo"; exit 1

      - name: Smoke test
        run: bash scripts/smoke_test.sh http://localhost:8000

      - name: Logs del contenedor
        if: always()
        run: docker logs xg
